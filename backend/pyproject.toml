[project]
name = "graphmaster-backend"
version = "1.0.0"
description = "GraphMaster — AI-powered gamified graph description learning platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0",
    "python-multipart>=0.0.19",
    "pillow>=11.0.0",
    "spacy>=3.8.0",
    "nltk>=3.9.1",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10.0",
    "google-cloud-vision>=3.8.0",
]
reports = [
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
]
dev = [
    # The export libraries are optional in production but not in the suite:
    # `test_reports.py` renders every format, and a run without them would
    # skip the paths most likely to break rather than exercising them.
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the framework's own idiom
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "N999"]
"tests/*" = ["E501"]
# Seed data is user-facing prose; en dashes in "60-89%" ranges are deliberate.
"app/db/seed/data.py" = ["RUF001"]
# User-facing typography is deliberate: "500×500 pixels", "0.0–1.0",
# "deskew(+2.2°)". And the OCR post-processor must match the real Unicode
# hyphens engines emit, so those literals cannot be normalised to ASCII.
"app/ocr/postprocess.py" = ["RUF001"]
"app/ocr/validation.py" = ["RUF001", "RUF002"]
"app/schemas/ocr.py" = ["RUF001"]
"tests/unit/test_ocr_postprocess.py" = ["RUF001"]
# The normaliser's whole job is mapping the real Unicode characters students
# paste in — curly quotes, en dashes, non-breaking spaces. Rewriting those
# literals to their ASCII lookalikes would delete the mapping it performs, and
# the tests must feed it the same real characters.
"app/nlp/normalise.py" = ["RUF001", "RUF002"]
"tests/unit/test_nlp_normalise.py" = ["RUF001"]
# Ranges and formulae in user-facing prose: "150-250 words", "(detected / total) x 100".
"app/nlp/writing.py" = ["RUF002"]
"app/nlp/scoring.py" = ["RUF002"]
# Ranges written as "0-1" and "0-100" use an en dash deliberately; these are
# developer-facing docstrings and error messages, not identifiers.
"app/assessment/issues.py" = ["RUF001", "RUF003"]
"app/assessment/protocol.py" = ["RUF001", "RUF003"]
"app/nlp/feedback.py" = ["RUF001"]
"app/nlp/defaults.py" = ["RUF003"]
"tests/unit/test_nlp_scoring.py" = ["RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# The performance budgets are deselected by default: they are the only tests
# whose result depends on the machine, and a laptop with a build running would
# fail them for reasons that say nothing about the code. Run them with
# `make perf`, or `pytest -m perf`.
addopts = "-q --strict-markers -m 'not perf'"
markers = [
    "perf: measures a performance budget from the SRS (NFR-1.1, NFR-1.2)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/seed/*", "alembic/*", "*/__init__.py"]
# SQLAlchemy's async layer switches greenlets on every await that touches the
# database. Without this, coverage loses every line executed after such an
# await and reports well-tested async services as barely covered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "class .*\\(Protocol\\):",
    # Debugging aids. Asserting on their formatting would freeze a string
    # nobody reads except in a traceback, and testing them to lift a number
    # is the kind of coverage that measures nothing.
    "def __repr__",
]
